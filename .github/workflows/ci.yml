name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 前端类型检查与构建
        working-directory: web
        run: pnpm build
      - name: 前端单测与类型检查
        working-directory: web
        run: |
          pnpm test
          pnpm exec tsc --noEmit
      - name: DSH 插件测试
        working-directory: dsh-plugin
        run: node --test test/*.test.js
      - name: OpenAPI 契约与前端类型一致
        run: |
          go run ./cmd/ks hub openapi > web/openapi.json
          (cd web && pnpm gen:api)
          git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: 安装脚本
        run: shellcheck scripts/install.sh scripts/deploy.sh

  # Windows：Go 的单测与 e2e（前端产物用仓库里的占位页即可），以及 install.ps1 的语法检查
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: 安装脚本语法
        shell: powershell
        run: |
          # 按 UTF-8 读再解析，与 irm | iex 拿到的文本相同（5.1 的 ParseFile 把无 BOM 的文件按 ANSI 读；脚本不能加 BOM，iex 不认）
          $errs = $null
          $src = [IO.File]::ReadAllText("$PWD\scripts\install.ps1", [Text.Encoding]::UTF8)
          [void][System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
